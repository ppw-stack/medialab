[project]
name = "seedhelper"
version = "0.1.0"
description = "PT SeedHelper — 辅种自动化、免费种窗口看护与种子健康度监测"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "greenlet>=3.1",
    "apscheduler>=3.10.4",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "prometheus-client>=0.21",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "parsel>=1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    # 实装 1.4.0：1.x 弃用了未显式指定 loop scope 的写法
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = ["app", "README.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "SIM", "RUF"]
ignore = ["S101", "B008", "B027", "B017", "RUF001", "RUF002", "RUF003", "ASYNC230", "ASYNC240"]

[tool.ruff.lint.per-file-ignores]
"app/db/migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "app"
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["apscheduler.*", "aioresponses.*", "sqlalchemy.ext.asyncio.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sqlalchemy.*"]
disable_error_code = ["no-untyped-call", "no-untyped-def", "union-attr", "misc", "operator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest-asyncio 1.x：auto 模式免去每个 async 用例加 @pytest.mark.asyncio
asyncio_mode = "auto"
# event loop 作用域 = function。aiosqlite 连接池绑定创建它的 loop，
# 跨 loop 复用会抛 InterfaceError → DB fixture 必须 function 级。
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]