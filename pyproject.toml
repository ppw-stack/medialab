[project]
name = "medialab"
version = "0.2.0"
description = "MediaLab — 网盘媒体库治理（STRM 生成/整理/302 中转/WebDAV/上传）+ PT 辅种自动化"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "greenlet>=3.1",
    "apscheduler>=3.10.4",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "prometheus-client>=0.21",
    "python-multipart>=0.0.12",
    "beautifulsoup4>=4.12",
    "parsel>=1.9",
    # 图形验证码放大（FR-3.6 AI 读码）。纯 wheel、无系统依赖。
    "pillow>=11.0",
    # 凭据加密（AES-128-CBC + HMAC，驱动 cookie 落盘）
    "cryptography>=43.0",
    # WebDAV 协议实现（MIT）。只用它的**协议层**，认证/限流/审计走本项目
    # 自己的 ASGI 中间件（见 app/webdav/）。
    "wsgidav>=4.4",
    # WSGI → ASGI 桥接。**不要用 starlette.middleware.wsgi**——已废弃
    # （StarletteDeprecationWarning），官方指向 a2wsgi。
    "a2wsgi>=1.10",
    # 本地目录监听（上传任务）。此前靠 uvicorn[standard] 传递引入——
    # 直接 import 的库不该靠传递依赖，显式声明。
    "watchfiles>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    # 实装 1.4.0：1.x 弃用了未显式指定 loop scope 的写法
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
]

# 115 驱动依赖。
#
# **必须是 optional-dependencies**——写在 `[project.dependencies-115]`
# 不是合法的 PEP 508 字段，uv 会**静默忽略**它（曾因此 p115client 一直没装上）。
# 装法：uv sync --extra p115
p115 = [
    "p115client>=0.0.9.4.6.1",
    "p115cipher>=0.0.5.4",
    "p115pickcode>=0.0.5.4",
    "qrcode[pil]>=7.4",
]

# 光鸭盘驱动依赖。装法：uv sync --extra guangya
guangya = [
    "guangyaclient>=0.0.2",
    "httpx[http2]>=0.27",
    "qrcode[pil]>=7.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = ["app", "README.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "SIM", "RUF"]
ignore = ["S101", "B008", "B027", "B017", "RUF001", "RUF002", "RUF003", "ASYNC230", "ASYNC240"]

[tool.ruff.lint.per-file-ignores]
# 迁移脚本里有超长 SQL 字面量（ALTER TABLE 语句）
"app/db/migrations.py" = ["E501"]
"app/db/bootstrap.py" = ["E501"]
# WebDAV 鉴权说明里有宽 Markdown 表格（列多，天然超行宽）
"app/services/dav_auth.py" = ["E501"]
# 测试代码：pytest 用例名（中文）+ 多个 fixture 参数很容易超行宽
# ——不影响可读性，不强求
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "app"
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["apscheduler.*", "aioresponses.*", "sqlalchemy.ext.asyncio.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sqlalchemy.*"]
disable_error_code = ["no-untyped-call", "no-untyped-def", "union-attr", "misc", "operator"]

# 无类型存根的第三方包（PyPI 上的纯 Python 包）
[[tool.mypy.overrides]]
module = ["p115client.*", "p115cipher.*", "p115pickcode.*", "qrcode.*", "cryptography.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["guangyaclient.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["wsgidav.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest-asyncio 1.x：auto 模式免去每个 async 用例加 @pytest.mark.asyncio
asyncio_mode = "auto"
# event loop 作用域 = function。aiosqlite 连接池绑定创建它的 loop，
# 跨 loop 复用会抛 InterfaceError → DB fixture 必须 function 级。
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
# 覆盖率门槛。
#
# **当前实测 69%**（合并 strmmanger 后——它那侧的测试覆盖率高，把
# 整体从 58% 抬上来了）。
#
# 门槛随测试补充**逐步抬高，且只许升不许降**。这里设 65（留 4 个点
# 缓冲）——既能防覆盖率大幅下滑，又不至于因为合理的小重构（比如删掉
# 一段被大量测试覆盖的死代码）莫名变红。
#
# 每次补测试后：跑 `uv run pytest --cov=app` 看实际值，
# 把这个数字往上调（不低于当前实测值）。
fail_under = 65
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]