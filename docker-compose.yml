services:
  # 开发环境（端口 8080，数据 ./data-dev/）
  seedhelper-dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PY_IMAGE: ${PY_IMAGE:-python:3.12-slim}
    image: docker.io/ppw111/seedhelper:${TAG:-main}
    container_name: seedhelper-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-true}
      WEB_USERNAME: ${WEB_USERNAME:-admin}
      WEB_PASSWORD: ${WEB_PASSWORD}
      WEB_TOKEN: ${WEB_TOKEN}
      # 统一 RSS 拉取 cron
      FETCH_ALL_SITES_CRON: ${FETCH_ALL_SITES_CRON:-*/10 * * * *}
      # 免费种自动推送 cron
      PUSH_FREE_CRON: ${PUSH_FREE_CRON:-*/30 * * * *}
    env_file:
      - .env
    volumes:
      - ./config:/app/config
      - ./data-dev:/app/data         # SQLite WAL 文件（dev 独立）
      - ./logs-dev:/app/logs
      - /data/torrents:/data/torrents   # 共享下载目录（空间统计 + 回收站 rename 目标）
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 60s        # 配合 SIGTERM 优雅停机（FR-8.2）
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
