title: 不得在源代码/配置/测试里硬编码凭据
rule: |
  API key、token、私钥、站点 cookie 等凭据不得硬编码在源代码、配置文件或测试里。

  - 凭据一律走环境变量或加密存储（本项目：cryptography AES-128-CBC + HMAC
    加密落盘，驱动 cookie 由 app/adapters 的加密层管理）。
  - 按「上下文」判定：变量名、请求头用法、认证流程里出现的字符串，即使熵不高
    也按凭据处理。
  - 若疑似泄漏：立即轮换，必要时从 git 历史中清除。
severity: high
scope: file
path: '**/*'
inheritance:
  inheritable: true
  exclude: []
  include: []
