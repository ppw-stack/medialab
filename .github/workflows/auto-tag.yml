name: auto-tag

# 定时自动打版本 tag（每天一次，UTC 03:17 → 北京时间 11:17）。
#
# 为什么单独一个 workflow：打 tag 是**发布的第一环**，它必须能在「没人
# 盯着」的情况下自己跑完，且要能安全地失败而不产生半个版本。
#
# 产出的 tag 形如 v1.0.4（只自增 patch），落在 **main 的 HEAD** 上。
#
# ════════════════════════════════════════════════════════════════════
# ⚠️⚠️⚠️ 核心机制：为什么不能用「推 tag」来触发后续 workflow
# ════════════════════════════════════════════════════════════════════
#
# GitHub **一律不触发**由 Actions 内部发起的 push（防递归：workflow A 推
# tag → 触发 workflow B → B 又推 tag → …）。这条抑制**与用什么凭据无关**，
# 不是权限问题。2026-11-20 实测矩阵（同一 tag、同一 commit、只换凭据）：
#
#   | 推 tag 的位置         | 凭据                            | ci 被触发？ |
#   |-----------------------|---------------------------------|------------|
#   | **本机手工推**        | classic token (repo+workflow)   | ✅          |
#   | **Actions runner 内** | fine-grained PAT（+Workflows）  | ❌          |
#   | **Actions runner 内** | classic PAT / gh CLI token      | ❌          |
#
# → 「换 PAT / 加权限」全是白费力气，**位置**才是变量。
#
# GitHub 官方留了两个例外：`workflow_dispatch` 与 **`repository_dispatch`**。
# 本 workflow 用后者把「发布」交给 docker-image.yml：
#
#   auto-tag（GITHUB_TOKEN 推 tag，不触发任何 workflow）
#     → POST /repos/{owner}/{repo}/dispatches（event_type=release-tag）
#       → ★ repository_dispatch 会创建 workflow run ★
#         → docker-image.yml 检出该 commit → 构建并推送镜像
#
# → **全程零外部凭据**：不需要 PAT、不需要 secret、不会过期。
#    （environment `tag` 现在只作发布门禁 + 审计记录，不再存 token。）
#
# ⚠️ 由此带来的语义变化：**tag push 不再触发 ci.yml**（本来也触发不了）。
#   故推 tag **之前**多一道闸：main HEAD 必须已有**成功的 ci run**
#   （main push 时 ci.yml 已经跑过同一个 commit → 闸门覆盖到了）。
#   见下面的「Gate: CI must be green」步骤。

on:
  schedule:
    # ⚠️ UTC，不是北京时间。避开整点（GitHub 高负载时整点定时任务会明显
    #    延迟甚至延后一小时；错开整点更稳）。'17 3 * * *' = UTC 03:17
    #    = 北京时间 11:17。
    - cron: '17 3 * * *'
  # 手动触发（改完 workflow 想立刻验证、或需要临时补一次发布）：
  #   dry_run=true → 只打印会打什么 tag，不推
  #   force=true  → 忽略「今天已发过」「无新提交」「ci 未绿」三个跳过条件
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只演练，不创建也不推送 tag'
        type: boolean
        default: false
      force:
        description: '忽略「今天已发过」「无新提交」「ci 未绿」三个跳过条件'
        type: boolean
        default: false

permissions:
  contents: write   # 推 tag + 发 repository_dispatch
  actions: read     # 查 actions/runs（前置 ci 闸门 + 末尾的触发校验）

jobs:
  tag:
    # environment 只作**发布门禁 + 审计记录**（分支策略限死 main，
    # 防从任意分支手动触发；deployment 记录留下「谁在什么时候发了版」）。
    # ⚠️ 这里**不再需要任何 secret**——推 tag 用的是 checkout 自带的
    #    GITHUB_TOKEN（persist-credentials 默认开），不需要 PAT。
    environment: tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      # 同名组串行：schedule 与手动触发不会并发推两个 tag
      group: auto-tag
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          # fetch-depth: 0 —— 要全部历史与 tag：算版本号、查最新 tag、
          # 算「相对最新 tag 有几个新提交」都依赖完整仓库
          fetch-depth: 0
          # persist-credentials 默认 true → .git/config 里带 GITHUB_TOKEN
          # 的 Authorization 头 → 后面 `git push origin` 直接可用，
          # **无需任何 PAT / secret**。

      - name: Compute next tag
        id: ver
        env:
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          echo "::group::环境"
          echo "HEAD: $(git rev-parse HEAD)"
          echo "今天（北京）: $(TZ=Asia/Shanghai date +%F)"
          echo "::endgroup::"

          # ---- 1. 算下一个版本号：只自增 patch --------------------------
          # v1.0.3 → v1.0.4；v1.2.9 → v1.2.10
          LATEST=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1 || true)
          if [ -z "$LATEST" ]; then
            TAG="v0.0.1"
          else
            CORE=${LATEST#v}
            MAJ=$(echo "$CORE" | cut -d. -f1)
            MIN=$(echo "$CORE" | cut -d. -f2)
            PAT=$(echo "$CORE" | cut -d. -f3)
            PAT=${PAT:-0}
            TAG="v${MAJ}.${MIN}.$((PAT + 1))"
          fi
          echo "最新 tag：${LATEST:-（无）} → 本次将打：${TAG}"

          # ---- 2. 幂等闸：今天已发过版本 → 跳过 ------------------------
          # 「每天 1 次」的落地：按**北京时间**判「今天」。
          # tag 的创建时间用 `%(creatordate)`：annotated tag 取 tagger
          # 时间、lightweight tag 取 commit 时间——两种 tag 都覆盖到，
          # 且 git 的日期输出遵循 TZ 环境变量。
          if [ -n "$LATEST" ] && [ "$FORCE" != "true" ]; then
            LATEST_DATE=$(TZ=Asia/Shanghai git for-each-ref \
              --format='%(creatordate:short)' "refs/tags/$LATEST" 2>/dev/null || true)
            TODAY=$(TZ=Asia/Shanghai date +%F)
            if [ -n "$LATEST_DATE" ] && [ "$LATEST_DATE" = "$TODAY" ]; then
              echo "最新 tag $LATEST 就是今天（$TODAY 北京）打的 → 跳过"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # ---- 3. 无新提交 → 跳过 --------------------------------------
          # main 相对最新 tag 没有新 commit → 没什么可发布的，跳过。
          if [ "$FORCE" != "true" ] && [ -n "$LATEST" ] \
             && git rev-parse -q --verify "refs/tags/$LATEST" >/dev/null; then
            AHEAD=$(git rev-list "$LATEST"..HEAD --count)
            if [ "$AHEAD" = "0" ]; then
              echo "main 相对 $LATEST 无新提交 → 跳过"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "相对 $LATEST 有 $AHEAD 个新提交 → 发布"
          fi

          # ---- 4. 同名 tag 已存在（并发/重算的保险）→ 跳过 -------------
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG 已存在 → 跳过"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Dry run
        if: steps.ver.outputs.tag != '' && (inputs.dry_run == true)
        run: |
          echo "::notice::dry-run：将创建并推送 tag ${{ steps.ver.outputs.tag }}（本次未推）"

      - name: "Gate: CI must be green"
        id: gate
        if: steps.ver.outputs.tag != '' && (inputs.dry_run != true)
        env:
          FORCE: ${{ inputs.force }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # tag push **不再触发 ci.yml**（Actions 内发起的 push 一律不触发），
          # 故这里补一道闸：发布的那个 commit 必须**已经**有一个成功的
          # ci run（main push 时 ci.yml 跑的就是同一个 commit → 覆盖到了）。
          #
          # 不补这道闸的后果：main 的 ci 红了照样发版、照样出镜像 →
          # 「闸门」名存实亡。
          SHA=$(git rev-parse HEAD)
          CI_RUN=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SHA}&status=success&per_page=20" \
            --jq '[.workflow_runs[] | select(.name == "ci")] | .[0].id' 2>/dev/null || true)
          if [ -n "$CI_RUN" ]; then
            echo "✓ 该 commit 已有成功的 ci run：${CI_RUN}"
            echo "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN}"
          elif [ "$FORCE" = "true" ]; then
            echo "::warning::该 commit 没有成功的 ci run，但 force=true → 继续发布"
          else
            echo "::error::该 commit（${SHA}）没有成功的 ci run → 拒绝发布"
            echo "::error::（main push 时 ci.yml 会跑同一个 commit；闸门红了不该发版）"
            echo "::error::确认无误可 force=true 绕过"
            exit 1
          fi

      - name: Create and push tag
        if: steps.ver.outputs.tag != '' && (inputs.dry_run != true)
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "auto-tag $TAG"
          # 用 checkout 自带的 GITHUB_TOKEN 推（凭据在 .git/config 里）。
          # ⚠️ 这个 push **不会**触发任何 workflow —— GitHub 抑制 Actions
          #    内部发起的 push。后续靠下面的 repository_dispatch 接力。
          git push origin "refs/tags/${TAG}"
          echo "✓ 已推送 ${TAG}"

      - name: Dispatch release build
        id: dispatch
        if: steps.ver.outputs.tag != '' && (inputs.dry_run != true)
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # repository_dispatch 是 GitHub 官方对「Actions 内发起的动作」留的
          # **例外**（GITHUB_TOKEN 触发的事件里，只有 workflow_dispatch 与
          # repository_dispatch 会创建 workflow run）→ 靠它把「发布」交给
          # docker-image.yml。
          #
          # client_payload 带上 tag 与它指向的 commit —— docker-image.yml
          # 靠这俩算镜像 tag（latest / 1.0.7 / 1.0）。
          SHA=$(git rev-list -n 1 "$TAG")
          echo "→ dispatch release-tag：tag=${TAG} sha=${SHA}"
          # ⚠️ 用 herestring（<<<）而不是 heredoc（<<EOF）：heredoc 的结束
          #    标记必须顶格，写在 YAML 的 run 块里会破坏缩进。
          PAYLOAD=$(printf '{"event_type":"release-tag","client_payload":{"tag":"%s","sha":"%s"}}' \
            "$TAG" "$SHA")
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
            --input - <<< "$PAYLOAD"
          echo "✓ repository_dispatch 已发出"

      - name: Verify release build was triggered
        id: verify
        if: steps.ver.outputs.tag != '' && (inputs.dry_run != true)
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          # gh CLI 读 GH_TOKEN 环境变量认证。⚠️ 不能写 "$GITHUB_TOKEN"——
          # Actions 不注入该环境变量（它只在 github.token 上下文里），
          # set -u 下会 unbound variable → 校验永远查不到 → 假阴性。
          GH_TOKEN: ${{ github.token }}
          STARTED_AT: ${{ github.run_started_at }}
        run: |
          set -euo pipefail
          # 把「tag 推了但镜像构建没被触发」从**静默失败**变成**显式失败**。
          #
          # 为什么要查：dispatch 没送达 / 被拒 / workflow 没匹配 event_type
          # 时，tag **在远端**、但镜像构建根本不会跑 → 没人看日志就完全
          # 发现不了（2026-11-20 实测踩过同类坑）。
          #
          # 判定：GitHub 收到 dispatch 后通常 5~15 秒内创建 run，轮询 60 秒。
          # repository_dispatch 的 run 没有 tag 字段可比对 → 用「创建时间晚于
          # 本次 run 开始时间」来认领（ISO8601 字符串比较即时间序）。
          RUN_ID=""
          for i in $(seq 1 12); do
            RUN_ID=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs?event=repository_dispatch&per_page=10" \
              --jq '.workflow_runs[] | "\(.id) \(.created_at) \(.name)"' \
              2>/dev/null | awk -v t="$STARTED_AT" '$2 >= t {print $1; exit}' || true)
            if [ -n "$RUN_ID" ]; then
              break
            fi
            sleep 5
          done
          if [ -n "$RUN_ID" ]; then
            echo "✓ 镜像构建已被触发：run ${RUN_ID}"
            echo "→ https://github.com/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
          else
            echo "::error::tag ${TAG} 已推送，但 60 秒内没有任何 workflow 因 repository_dispatch 被触发"
            echo "::error::→ 镜像不会推，而本 workflow 却是绿的——最坏的一类故障"
            echo "::error::检查：① docker-image.yml 是否声明了 repository_dispatch: types: [release-tag]"
            echo "::error::      ② 该 workflow 是否存在**默认分支**（repository_dispatch 只认默认分支）"
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### 自动打 tag 结果"
            echo ""
            if [ -n "${{ steps.ver.outputs.tag }}" ]; then
              echo "- 本次版本：**${{ steps.ver.outputs.tag }}**"
            else
              echo "- 本次版本：跳过（${{ steps.ver.outputs.skip }})"
            fi
            echo "- 分支：\`main\` @ $(git rev-parse --short HEAD 2>/dev/null || echo '-')"
            if [ -n "${{ steps.ver.outputs.tag }}" ]; then
              echo "- 镜像构建触发校验：\`${{ steps.verify.outcome }}\`（success = 已触发）"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
