name: ci

# 静态检查与测试闸门（Phase 0）。
#
# 与 docker-image.yml **并行**：那个 workflow 只做镜像构建 + 推送，
# 加检查会拖慢发布链路，故独立成 job。
#
# 闸门内容（AGENTS.md「静态检查不通过禁止合并」的落地）：
#   backend : ruff + mypy + pytest
#   frontend: vue-tsc（类型）+ oxlint（lint）
#
# 刻意**不含** Playwright e2e：现有 e2e 连的是真实下载器
# （192.168.0.172:9091）和真实站点，CI 上跑不了也不该跑。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # 固定到完整 commit SHA 防止 tag 被劫持后执行恶意代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        # --frozen：用 uv.lock 里的精确版本，不用 pyproject 的浮动范围
        run: uv sync --extra dev --frozen

      - name: Ruff
        run: uv run ruff check app/ tests/

      - name: Mypy
        # 只查 app/：测试代码不必过 --strict
        run: uv run mypy app/

      - name: Pytest
        # 覆盖率阈值在 pyproject 的 [tool.coverage.report] fail_under 里
        # （当前 0 = 不阻断，基线 44%）。补测试后逐步抬高，只许升不许降。
        run: |
          uv run pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  frontend:
    name: frontend (vue-tsc + oxlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Type check
        working-directory: web
        run: npx vue-tsc -b

      - name: Lint
        working-directory: web
        run: npx oxlint .
