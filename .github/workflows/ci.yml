name: ci

# 静态检查与测试闸门（Phase 0）。
#
# 与 docker-image.yml **并行**：那个 workflow 只做镜像构建 + 推送，
# 加检查会拖慢发布链路，故独立成 job。
#
# 闸门内容（AGENTS.md「静态检查不通过禁止合并」的落地）：
#   backend : ruff + mypy + pytest
#   frontend: vue-tsc（类型）+ oxlint（lint）
#
# 不含 e2e：项目不保留 Playwright e2e（原 e2e 连真实下载器与站点，
# CI 上跑不了，已整体移除）。

on:
  # 2026-11-17 改为 PR 流程：main 不再直推（分支保护）——改动走
  # feature 分支 + PR，闸门在 PR 上跑，绿了才能合并。
  pull_request:
    branches: [main]
  # main push 保留为兜底（万一绕过保护直推，闸门仍然会跑）
  push:
    branches: [main]
    # v* tag 也要跑闸门：版本发布镜像由「tag push 触发的 ci」通过后才构建
    # （见 docker-image.yml 的 Compute image tags 步骤）。
    tags: ['v*']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # 固定到完整 commit SHA 防止 tag 被劫持后执行恶意代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          # 与 Dockerfile 的 ARG UV_VERSION 保持一致（uv 升级会改变 lock 解释）
          uv-version: 0.13.9

      - name: Install dependencies
        # --frozen：用 uv.lock 里的精确版本，不用 pyproject 的浮动范围
        run: uv sync --extra dev --extra guangya --frozen

      - name: Ruff
        run: uv run ruff check app/ tests/

      - name: Mypy
        # 只查 app/：测试代码不必过 --strict
        run: uv run mypy app/

      - name: Pytest
        # 覆盖率阈值在 pyproject 的 [tool.coverage.report] fail_under 里
        # （当前 66 = 阻断）。这里显式再传一次，避免只看 workflow 的人误以为
        # 不阻断；只许升不许降。
        #
        # 2026-11-21：补齐「规则包驱动的通用适配器」移植层的纯函数与站点
        # 解析器测试，实测 63.4% → 66.19%，门槛随之从 65 提到 66。
        #
        # 只出 term 报告（人看），**不生成 coverage.xml、不上传 artifact**：
        # 仓库没有 codecov 等消费者，artifact 每次 CI 堆一份没人看。
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=66

  frontend:
    name: frontend (vue-tsc + oxlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Type check + build
        # npm run build = `vue-tsc -b && vite build`——类型检查与构建一次覆盖，
        # 不需要再单独跑 vue-tsc（重复且慢）。
        working-directory: web
        run: npm run build

      - name: Type placement check
        # API 契约类型必须集中在 web/src/types.ts（Phase 4）。
        # 独立 node 脚本——不依赖浏览器 / 容器。
        working-directory: web
        run: node scripts/check-types-placement.mjs

      - name: CSS class check
        # template 里用到的 class 必须有样式定义（本文件 <style> 或 global.css）。
        # 防的是「合并页面时丢了 <style scoped>」——vue-tsc / oxlint 都不管 CSS，
        # 丢了不会有任何报错，页面样式却已经坏了。独立 node 脚本，不依赖浏览器 / 容器。
        working-directory: web
        run: node scripts/check-css-classes.mjs

      - name: Lint
        working-directory: web
        run: npx oxlint .

  compose:
    name: compose (配置语法)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Validate docker-compose.yml
        # 只校验语法与变量插值，**不启动**任何容器。
        # 用 .env.example 充当 .env——CI 里没有真实 .env（也不该有）。
        run: |
          cp .env.example .env
          docker compose config --quiet
          echo "compose 配置校验通过"
