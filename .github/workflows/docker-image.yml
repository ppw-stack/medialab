name: docker-image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: docker.io
  IMAGE_NAME: ppw111/seedhelper

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=seedhelper
            org.opencontainers.image.description=PT 辅种自动化、免费种窗口看护与种子健康度监测
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PY_IMAGE=python:3.12-slim
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set Docker Hub repo visibility to public
        if: github.event_name != 'pull_request'
        env:
          DH_NAMESPACE: ppw111
          DH_REPO: seedhelper
        run: |
          # Docker Hub v2 API：PATCH /v2/repositories/{namespace}/{repo}/
          # Authorization: JWT（用 username + token 换短时 JWT）
          # 详细：https://docs.docker.com/docker-hub/api/latest/
          for i in 1 2 3 4 5; do
            JWT=$(curl -sS -X POST \
              -H "Content-Type: application/json" \
              -d "{\"username\":\"${{ secrets.DOCKERHUB_USERNAME }}\",\"password\":\"${{ secrets.DOCKERHUB_TOKEN }}\"}" \
              "https://hub.docker.com/v2/users/login/" | jq -r .token 2>/dev/null)
            if [ -n "$JWT" ] && [ "$JWT" != "null" ]; then
              echo "✓ got JWT (len=${#JWT})"
              break
            fi
            echo "attempt=$i: no JWT, retry in 3s"
            sleep 3
          done
          if [ -z "$JWT" ] || [ "$JWT" = "null" ]; then
            echo "::error::failed to obtain Docker Hub JWT"
            exit 1
          fi
          for i in 1 2 3 4 5; do
            RESP=$(curl -sS -X PATCH \
              -H "Authorization: JWT ${JWT}" \
              -H "Content-Type: application/json" \
              -d '{"is_private":false}' \
              -w "\n%{http_code}" \
              "https://hub.docker.com/v2/repositories/${DH_NAMESPACE}/${DH_REPO}/")
            HTTP_CODE=$(echo "$RESP" | tail -n1)
            BODY=$(echo "$RESP" | head -n-1)
            echo "attempt=$i http_code=$HTTP_CODE body=$BODY"
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "204" ]; then
              echo "✓ ${DH_NAMESPACE}/${DH_REPO} set to public"
              exit 0
            fi
            sleep 3
          done
          echo "::error::failed to set visibility=public for ${DH_NAMESPACE}/${DH_REPO}"
          exit 1
