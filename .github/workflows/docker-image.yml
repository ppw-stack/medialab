name: docker-image

# 由 ci.yml 的**成功**结果触发（workflow_run）——镜像构建必须等静态检查
# 与测试闸门全绿，否则「代码红了但镜像照样推、照样能部署到生产」。
#
# ★ 另有一条通道：**repository_dispatch**（来自 auto-tag.yml，见 `on:` 段
#   注释）。自动发版时**不能**靠「推 tag 触发 workflow_run」——GitHub 一律
#   不触发由 Actions 内部发起的 push（2026-11-20 实测：换凭据、换权限都
#   不行，**位置**才是变量）。repository_dispatch 是官方留的例外。
#
# 为什么不用 push 触发 + workflow_run 的组合：
#   · 本 workflow 只保留 workflow_run 一个触发器，**不**再自己响应 push
#     ——否则会与 workflow_run 路径**重复构建推送**两次
#   · PR 不构建镜像：PR 代码**永远不会**进入 build job（见 job 级 if），
#     所以 PR 的不可信代码拿不到 secrets、不会被执行
#
# ⚠️ workflow_run 的关键陷阱：此时 github.sha / github.ref 指向**默认
# 分支的 HEAD**（触发时那次 workflow_run 所属的 run），**不是**被测的
# 那个 commit。必须显式 checkout ${{ github.event.workflow_run.head_sha }}
# ——否则会构建出「上一个 commit 的镜像」而 tag 却标成 latest，极难发现。
#
# 同理，docker/metadata-action 在本事件下的 context.sha 也是默认分支
# HEAD（不是被测 commit），context.ref 永远是 refs/heads/main——故
# type=sha / type=semver 会产出**错误**的 tag。故此处**不用**
# metadata-action，改为自行计算 tag 与标签（见 Compute image tags 步骤）。
#
# ⚠️ repository_dispatch 通道同理：github.sha 是默认分支 HEAD → 用
#   client_payload.sha（auto-tag 传的是 tag 指向的那个 commit）。
on:
  workflow_run:
    workflows: ['ci']
    types: [completed]
  # ★ 发布通道：来自 auto-tag.yml 的 repository_dispatch。
  #
  # 为什么需要它：GitHub **一律不触发**由 Actions 内部发起的 push（防递归），
  # 所以 auto-tag 推的 tag 不会触发本 workflow（2026-11-20 实测：无论用
  # 什么凭据、什么权限，从 runner 内推的 tag 都不触发任何 workflow）。
  # repository_dispatch 是官方对「Actions 内发起的动作」留的**例外**
  # （GITHUB_TOKEN 触发的事件里，只有 workflow_dispatch 与
  # repository_dispatch 会创建 workflow run）→ 用它接力。
  #
  # 两条通道并存：
  #   · workflow_run      —— 手工推 tag v*（本地 git push）时走这条
  #   · repository_dispatch —— auto-tag 自动打 tag 时走这条
  # 两者产出的镜像完全一致（同一套 Compute image tags 逻辑）。
  repository_dispatch:
    types: ['release-tag']

env:
  REGISTRY: docker.io
  IMAGE_NAME: ppw111/medialab

jobs:
  build:
    # 闸门红 → 整个 job 跳过（不构建、不推送）。
    #
    # · conclusion != success：ci 任一 job 失败/被取消 → 不构建
    # · **只对 v* tag 的 ci 绿构建**（2026-11-17 改）：main push 的 ci 绿
    #   **不再出镜像**——镜像只在「发布」（tag v*）时打包。日常合并到 main
    #   的代码只过闸门，不出镜像；要部署就发布一个版本。
    # · event == push：PR 的 ci 通过了也不构建。**这一条同时是安全边界**：
    #   PR 代码不可信，不该在持有 Docker Hub 凭据的 job 里被 checkout + 执行。
    # · 发布判定**不能**用 workflow_run.head_branch——tag push 的
    #   head_branch 是 **main**（不是 tag 名），startsWith('v') 永远不命中
    #   → v1.0.0 的镜像因此没构建（2026-11-18 生产踩到）。发布判定移到
    #   Compute 步骤（git tag --points-at + SEMVER），非发布 → 整个 job
    #   干净跳过（见 skip 步骤）。
    #
    # ★ 但**触发源**的 head_branch 是可以用的：ci run 由 tag push 触发时
    #   head_branch = tag 名（v1.0.4），由 main push 触发时 = main。
    #   本通道只认「tag push 触发的 ci」——即**手工推 tag**那条路。
    #   main push 的 ci 走这里会与 auto-tag 的 repository_dispatch 通道
    #   **重复构建同一个版本**（auto-tag 是在 ci 绿之后才补打 tag 的，
    #   那个 tag 同样挂在 ci 的那个 commit 上 → --points-at 找得到它）。
    #   故用 startsWith(head_branch, 'v') 把两条通道的职责切干净：
    #     · workflow_run       → 手工 `git push origin v1.0.x` 发版
    #     · repository_dispatch → auto-tag 自动发版
    #
    # ★ repository_dispatch 通道（auto-tag 自动发版）：没有 workflow_run，
    #   「闸门红不构建」由 **auto-tag 侧的「Gate: CI must be green」** 把关
    #   （它确认该 commit 已有成功的 ci run 才允许发 dispatch）。
    if: >-
      github.event_name == 'repository_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: docker-image-${{ github.event.workflow_run.head_branch || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        # ⚠️ 必须用 workflow_run.head_sha，不是默认的 github.sha
        #    （那会 checkout 到默认分支 HEAD，可能是别的 commit）
        #
        # ★ repository_dispatch 通道：github.sha 是**默认分支 HEAD**，不是
        #   发布的那次 commit → 必须用 client_payload.sha
        #   （auto-tag 把 tag 指向的 commit sha 一并带上了）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.client_payload.sha }}
          # fetch-depth 0：拿全历史与 tag，供下面识别 v* semver tag
          fetch-depth: 0

      - name: Compute image tags
        id: meta
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.event.client_payload.sha }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          # v* semver tag → 额外产出版本号 tag（v1.2.3 → 1.2.3 与 1.2）
          # 仅当该 commit 上确实挂着 v* tag 时才有。
          #
          # ⚠️ 必须在写 tags heredoc **之前**算完：heredoc 里的每一行都是
          #    一个镜像 tag，多写一行提示语就会被当成 tag 推给 Docker Hub。
          SEMVER=$(git tag --points-at "$HEAD_SHA" \
            | grep -E '^v[0-9]+\.[0-9]+' | head -1 | sed 's/^v//' || true)
          # 2026-11-17 改：镜像只在发布（tag v*）时构建 → tag 只有
          # latest + semver（main / sha-* 随「main push 出镜像」一并移除）
          if [ -z "$SEMVER" ]; then
            # 非发布（main push 无 v* tag）→ **跳过整个构建**：只有发布才打包
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "未检测到 v* semver tag → 非 release，跳过构建（main 日常合并不出镜像）"
            exit 0
          fi
          {
            echo "tags<<TAGS_EOF"
            echo "${IMAGE}:latest"
            echo "${IMAGE}:${SEMVER}"
            echo "${IMAGE}:$(echo "$SEMVER" | cut -d. -f1,2)"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "labels<<LABELS_EOF"
            echo "org.opencontainers.image.title=medialab"
            echo "org.opencontainers.image.description=网盘媒体库治理(STRM/302/WebDAV/上传)+ PT 辅种自动化(免费种窗口/辅种巡检/孤儿清理)"
            echo "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}"
            echo "org.opencontainers.image.licenses=MIT"
            # revision 用**被测 commit**，不是 workflow_run 的 context.sha
            echo "org.opencontainers.image.revision=${HEAD_SHA}"
            echo "LABELS_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "被测 commit：${HEAD_SHA}"
          if [ -n "$SEMVER" ]; then
            echo "检测到 semver tag：${SEMVER}"
          else
            echo "未检测到 v* semver tag（只发 latest/main/sha-*）"
          fi
          echo "生成的 tag："
          # 打印上面写入的 tag（用 awk 而非 sed 的范围语法——heredoc
          # 标记里的 << 在 sed 正则里需要转义，易错）
          awk '/^tags<<TAGS_EOF$/{f=1;next} /^TAGS_EOF$/{f=0} f' "$GITHUB_OUTPUT" | sed 's/^/  /'

      - name: Skip if not a release
        if: steps.meta.outputs.skip == 'true'
        run: echo "非发布，跳过构建（镜像只在发布时打包）"

      - name: Set up Docker Buildx
        if: steps.meta.outputs.skip != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to Docker Hub
        if: steps.meta.outputs.skip != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: steps.meta.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PY_IMAGE=python:3.12-slim
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image is publicly pullable
        if: steps.meta.outputs.skip != 'true'
        # 校验镜像**匿名可拉**（128 主机没有 Docker Hub 凭据，靠 public
        # 仓库拉取；私有则 pull 失败 → 生产部署不了）。
        #
        # 为什么不用「调 Docker Hub API 设 is_private=false」：那个接口现在
        # 对 JWT 认证的 PATCH 返回 **403**（实测 2026-10-22 起连续 3 次 CI
        # 全部 403）。仓库早已是 public，那步从未成功过，纯死步骤。
        #
        # 这里改成**只读校验**：用匿名 token 拉 manifest，200 = public 可拉。
        # 失败即视为真问题（生产会拉不动），让 workflow 变红。
        #
        # 注意两处路径**不带 registry host**（实测带 host 会 401）：
        #   scope=repository:${IMAGE_NAME}:pull   ← 不含 docker.io/
        #   /v2/${IMAGE_NAME}/manifests/latest    ← 不含 docker.io/
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          TOKEN=$(curl -fsS \
            "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${IMAGE_NAME}:pull" \
            | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          if [ -z "$TOKEN" ]; then
            echo "::error::取匿名 pull token 失败"
            exit 1
          fi
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.index.v1+json" \
            "https://registry-1.docker.io/v2/${IMAGE_NAME}/manifests/latest")
          echo "匿名拉取 manifest: HTTP=${CODE}"
          # 429 = 触发 Docker Hub 匿名拉取限流（100 次/小时/IP，共享
          # runner IP 可能撞上）。那是基础设施抖动、不是可见性问题，
          # 不该拦住发布——警告后放行。
          if [ "$CODE" = "429" ]; then
            echo "::warning::Docker Hub 匿名拉取被限流（429），跳过可见性校验（镜像应仍为 public）"
            exit 0
          fi
          if [ "$CODE" != "200" ]; then
            echo "::error::${IMAGE_NAME} 匿名拉取失败（HTTP=${CODE}）——仓库可能不是 public，128 主机 pull 会失败"
            exit 1
          fi
          echo "✓ ${IMAGE_NAME} 匿名可拉（public）"
