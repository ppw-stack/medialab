name: docker-image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: docker.io
  IMAGE_NAME: ppw111/seedhelper

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: docker-image-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        # 固定到完整 commit SHA 防止 tag 被劫持后执行恶意代码
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2  # v3.10.0

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567  # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96  # v5.6.1
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=seedhelper
            org.opencontainers.image.description=PT 辅种自动化、免费种窗口看护与种子健康度监测
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355  # v6.10.0
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PY_IMAGE=python:3.12-slim
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set Docker Hub repo visibility to public
        if: github.event_name != 'pull_request'
        # 非关键步骤：镜像已构建推送成功，这步失败只导致镜像保持私有
        #（128 主机 pull 会失败）。
        #
        # continue-on-error 的语义：步骤失败**不会**让 job 变红，GitHub 也不
        # 会为它渲染注解（`::error::` 会被吞掉）。所以下面在 run 里用
        # `::warning::` 显式打一条注解——这样"镜像可能不可拉取"会在
        # workflow 页面直接可见，而不是只躺在步骤日志里。
        continue-on-error: true
        env:
          DH_NAMESPACE: ppw111
          DH_REPO: seedhelper
          DH_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          JWT=""
          for i in 1 2 3 4 5; do
            PAYLOAD=$(jq -nc --arg u "$DH_USERNAME" --arg p "$DH_TOKEN" '{username:$u,password:$p}')
            LOGIN_RESP=$(curl -sS -X POST \
              -H "Content-Type: application/json" \
              --data "$PAYLOAD" \
              -w "\nHTTP=%{http_code}" \
              "https://hub.docker.com/v2/users/login/")
            HTTP=$(printf '%s\n' "$LOGIN_RESP" | tail -n1 | sed 's/HTTP=//')
            BODY=$(printf '%s\n' "$LOGIN_RESP" | head -n-1)
            # 响应体含 JWT / 凭据回显, 只输出 HTTP 状态码
            echo "login attempt=$i http=$HTTP"
            JWT=$(printf '%s' "$BODY" | jq -r '.token // empty' 2>/dev/null || true)
            if [ -n "$JWT" ]; then
              echo "✓ got JWT (len=${#JWT})"
              break
            fi
            sleep 3
          done
          if [ -z "$JWT" ]; then
            echo "::warning::无法获取 Docker Hub JWT（重试 5 次失败），镜像可能保持私有，128 主机 pull 会失败"
            exit 1
          fi
          for i in 1 2 3 4 5; do
            RESP=$(curl -sS -X PATCH \
              -H "Authorization: JWT ${JWT}" \
              -H "Content-Type: application/json" \
              --data '{"is_private":false}' \
              -w "\n%{http_code}" \
              "https://hub.docker.com/v2/repositories/${DH_NAMESPACE}/${DH_REPO}/")
            HTTP_CODE=$(printf '%s\n' "$RESP" | tail -n1)
            BODY=$(printf '%s\n' "$RESP" | head -n-1)
            echo "patch attempt=$i http_code=$HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "204" ]; then
              echo "✓ ${DH_NAMESPACE}/${DH_REPO} set to public"
              exit 0
            fi
            sleep 3
          done
          echo "::warning::设置 ${DH_NAMESPACE}/${DH_REPO} 为 public 失败，镜像可能保持私有，128 主机 pull 会失败"
          exit 1
