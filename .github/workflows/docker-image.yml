name: docker-image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: docker.io
  IMAGE_NAME: ppw111/seedhelper

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: docker-image-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=seedhelper
            org.opencontainers.image.description=PT 辅种自动化、免费种窗口看护与种子健康度监测
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PY_IMAGE=python:3.12-slim
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set Docker Hub repo visibility to public
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          DH_NAMESPACE: ppw111
          DH_REPO: seedhelper
          DH_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          JWT=""
          for i in 1 2 3 4 5; do
            PAYLOAD=$(jq -nc --arg u "$DH_USERNAME" --arg p "$DH_TOKEN" '{username:$u,password:$p}')
            LOGIN_RESP=$(curl -sS -X POST \
              -H "Content-Type: application/json" \
              --data "$PAYLOAD" \
              -w "\nHTTP=%{http_code}" \
              "https://hub.docker.com/v2/users/login/")
            HTTP=$(printf '%s\n' "$LOGIN_RESP" | tail -n1 | sed 's/HTTP=//')
            BODY=$(printf '%s\n' "$LOGIN_RESP" | head -n-1)
            # 响应体含 JWT / 凭据回显, 只输出 HTTP 状态码
            echo "login attempt=$i http=$HTTP"
            JWT=$(printf '%s' "$BODY" | jq -r '.token // empty' 2>/dev/null || true)
            if [ -n "$JWT" ]; then
              echo "✓ got JWT (len=${#JWT})"
              break
            fi
            sleep 3
          done
          if [ -z "$JWT" ]; then
            echo "::error::failed to obtain Docker Hub JWT after 5 attempts"
            exit 1
          fi
          for i in 1 2 3 4 5; do
            RESP=$(curl -sS -X PATCH \
              -H "Authorization: JWT ${JWT}" \
              -H "Content-Type: application/json" \
              --data '{"is_private":false}' \
              -w "\n%{http_code}" \
              "https://hub.docker.com/v2/repositories/${DH_NAMESPACE}/${DH_REPO}/")
            HTTP_CODE=$(printf '%s\n' "$RESP" | tail -n1)
            BODY=$(printf '%s\n' "$RESP" | head -n-1)
            echo "patch attempt=$i http_code=$HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "204" ]; then
              echo "✓ ${DH_NAMESPACE}/${DH_REPO} set to public"
              exit 0
            fi
            sleep 3
          done
          echo "::error::failed to set visibility=public for ${DH_NAMESPACE}/${DH_REPO}"
          exit 1
