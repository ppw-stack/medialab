name: docker-image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: docker.io
  IMAGE_NAME: ppw111/seedhelper

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: docker-image-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        # 固定到完整 commit SHA 防止 tag 被劫持后执行恶意代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=seedhelper
            org.opencontainers.image.description=PT 辅种自动化、免费种窗口看护与种子健康度监测
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PY_IMAGE=python:3.12-slim
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image is publicly pullable
        if: github.event_name != 'pull_request'
        # 校验镜像**匿名可拉**（128 主机没有 Docker Hub 凭据，靠 public
        # 仓库拉取；私有则 pull 失败 → 生产部署不了）。
        #
        # 为什么不用「调 Docker Hub API 设 is_private=false」：那个接口现在
        # 对 JWT 认证的 PATCH 返回 **403**（实测 2026-10-22 起连续 3 次 CI
        # 全部 403）。仓库早已是 public，那步从未成功过，纯死步骤。
        #
        # 这里改成**只读校验**：用匿名 token 拉 manifest，200 = public 可拉。
        # 失败即视为真问题（生产会拉不动），让 workflow 变红。
        #
        # 注意两处路径**不带 registry host**（实测带 host 会 401）：
        #   scope=repository:${IMAGE_NAME}:pull   ← 不含 docker.io/
        #   /v2/${IMAGE_NAME}/manifests/latest    ← 不含 docker.io/
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          TOKEN=$(curl -fsS \
            "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${IMAGE_NAME}:pull" \
            | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          if [ -z "$TOKEN" ]; then
            echo "::error::取匿名 pull token 失败"
            exit 1
          fi
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.index.v1+json" \
            "https://registry-1.docker.io/v2/${IMAGE_NAME}/manifests/latest")
          echo "匿名拉取 manifest: HTTP=${CODE}"
          # 429 = 触发 Docker Hub 匿名拉取限流（100 次/小时/IP，共享
          # runner IP 可能撞上）。那是基础设施抖动、不是可见性问题，
          # 不该拦住发布——警告后放行。
          if [ "$CODE" = "429" ]; then
            echo "::warning::Docker Hub 匿名拉取被限流（429），跳过可见性校验（镜像应仍为 public）"
            exit 0
          fi
          if [ "$CODE" != "200" ]; then
            echo "::error::${IMAGE_NAME} 匿名拉取失败（HTTP=${CODE}）——仓库可能不是 public，128 主机 pull 会失败"
            exit 1
          fi
          echo "✓ ${IMAGE_NAME} 匿名可拉（public）"
