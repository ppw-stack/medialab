name: docker-image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  # 显式命名：避免 GHCR 把仓库名 'ptHelper' 自动小写化为 'pthelper' 导致后续引用错乱
  IMAGE_NAME: ppw-stack/seedhelper

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=seedhelper
            org.opencontainers.image.description=PT 辅种自动化、免费种窗口看护与种子健康度监测
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PY_IMAGE=python:3.12-slim
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set GHCR package visibility to public
        if: github.event_name != 'pull_request'
        run: |
          PACKAGE_NAME="seedhelper"
          for i in 1 2 3 4 5; do
            RESP=$(curl -sS -X PATCH \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -d '{"visibility":"public"}' \
              -w "\n%{http_code}" \
              "https://api.github.com/user/packages/container/${PACKAGE_NAME}")
            HTTP_CODE=$(echo "$RESP" | tail -n1)
            BODY=$(echo "$RESP" | head -n-1)
            echo "attempt=$i http_code=$HTTP_CODE body=$BODY"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✓ ${PACKAGE_NAME} set to public"
              break
            fi
            # 404 = 镜像还没建（PR 第一次推）；重试等镜像创建
            sleep 5
          done
